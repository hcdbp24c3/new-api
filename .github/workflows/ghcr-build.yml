name: Publish Docker image (GHCR)

on:
  push:
    branches:
      - feature/multi-key-testing
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build. Leave empty to build the pushed branch commit.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version & write VERSION
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            case "$GITHUB_REF" in
              refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
              *) TAG="${GITHUB_REF#refs/heads/}" ;;
            esac
          fi
          # A Docker tag may only use [A-Za-z0-9_][A-Za-z0-9._-]{0,127}. A branch
          # name carries '/' and would otherwise produce an invalid reference.
          TAG_SAFE="$(printf '%s' "$TAG" | tr '/' '_')"
          echo "version=${TAG_SAFE}" >> "$GITHUB_OUTPUT"
          echo "${TAG_SAFE}" > VERSION
          echo "Building ${TAG_SAFE} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feature/multi-key-testing' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # Only the arch-suffixed tag is pushed here. Publishing the shared
          # tags from this job makes the two matrix runs overwrite each other:
          # each pushes a single-arch image under the same name, and whichever
          # finishes last wins, leaving no manifest list behind. The shared tags
          # are built from both arches in create_manifests instead.
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Image summary
        run: |
          {
            echo "### GHCR Image Digest (${{ matrix.arch }})"
            echo '```'
            echo "${IMAGE}:${TAG}-${{ matrix.arch }}"
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Set version
        run: echo "TAG=${{ needs.build_single_arch.outputs.version }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve public tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feature/multi-key-testing' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ needs.build_single_arch.outputs.version }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Every public tag is assembled here from the two arch-specific images.
      # Building them in the matrix job cannot work: each run would push its own
      # single-arch image to the same tag and the last run to finish would
      # replace the other, leaving a tag with no arm64 entry.
      - name: Create & push multi-arch manifests
        run: |
          set -euo pipefail
          # The tag list is newline-separated, so it must be read line by line;
          # word-splitting it into a `for ... in` list runs the second tag into
          # the shell as a command and fails to parse.
          while IFS= read -r TAG_NAME; do
            [ -z "$TAG_NAME" ] && continue
            echo "Creating ${TAG_NAME} from ${TAG}-amd64 and ${TAG}-arm64"
            docker buildx imagetools create \
              -t "${TAG_NAME}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Manifest summary
        run: |
          {
            echo "### Multi-arch Manifests"
            echo '```'
            docker buildx imagetools inspect "${IMAGE}:${TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"